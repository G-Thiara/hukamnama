<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ਹੁਕਮਨਾਮਾ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #F6F3ED;
      --border:      rgba(170, 88, 10, 0.13);
      --saffron:     #B05208;
      --saffron-dim: rgba(176, 82, 8, 0.13);
      --navy:        #1B3464;
      --text:        #18130D;
      --muted:       rgba(24, 19, 13, 0.42);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 30% at 50% 0%, rgba(176,82,8,0.07) 0%, transparent 65%),
        radial-gradient(ellipse 50% 25% at 95% 100%, rgba(27,52,100,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    main { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 2rem; }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 4rem 0 2rem;
      border-bottom: 1px solid var(--border);
    }

    .ik-onkar {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-size: clamp(2.8rem, 7vw, 4.5rem);
      color: var(--saffron);
      line-height: 1;
      margin-bottom: 1.4rem;
    }

    header h1 {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-weight: 400;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      color: var(--navy);
      letter-spacing: 0.04em;
      margin-bottom: 1rem;
    }

    .h1-punjabi {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-weight: 400;
      font-size: clamp(0.85rem, 1.8vw, 0.98rem);
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .h1-sub {
      font-family: 'EB Garamond', serif;
      font-size: clamp(1.05rem, 2.2vw, 1.25rem);
      color: var(--navy);
      letter-spacing: 0.02em;
      margin-bottom: 0.9rem;
    }

    .date-line {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
    }

    .date-gregorian { font-family: 'EB Garamond', serif; }
    .date-sep { opacity: 0.4; }
    .date-nanakshahi { font-family: 'Noto Sans Gurmukhi', sans-serif; font-size: 0.82rem; }

    /* ── Essence ── */
    .essence {
      margin: 2rem 0 0;
      padding: 1.8rem 2rem 1.8rem 2.2rem;
      border-left: 2.5px solid var(--saffron);
      background: rgba(255, 255, 255, 0.5);
    }

    .essence-label {
      font-size: 0.62rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--saffron);
      margin-bottom: 0.85rem;
      font-family: 'EB Garamond', serif;
    }

    .essence-text {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.15rem, 2.5vw, 1.45rem);
      line-height: 1.7;
      color: var(--navy);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin: 2rem 0 1.5rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
      opacity: 0.5;
    }

    .divider-glyph {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-size: 0.95rem;
      color: var(--saffron);
      opacity: 0.45;
    }

    /* ── Verses — stacked ── */
    .verses { padding-bottom: 5rem; }

    .verse {
      padding: 0.9rem 0;
    }

    .verse.is-header {
      padding: 0.4rem 0;
    }

    .verse.is-rahao {}

    .gurmukhi-text {
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-size: clamp(1.1rem, 2.2vw, 1.3rem);
      font-weight: 400;
      line-height: 2;
      color: var(--text);
    }

    .verse.is-header .gurmukhi-text {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.5;
      line-height: 1.5;
      font-family: 'EB Garamond', serif;
    }

    .transliteration {
      margin-top: 0.15rem;
      font-family: 'Noto Sans Gurmukhi', sans-serif;
      font-weight: 300;
      font-size: 0.96rem;
      color: rgba(24, 19, 13, 0.5);
      line-height: 1.6;
      letter-spacing: 0.02em;
    }

    .english-text {
      margin-top: 0.45rem;
      font-family: 'EB Garamond', serif;
      font-size: clamp(1.15rem, 2.2vw, 1.28rem);
      line-height: 1.85;
      color: rgba(24, 19, 13, 0.62);
    }

    .verse.is-header .english-text {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--navy);
      opacity: 0.45;
      margin-top: 0.2rem;
      line-height: 1.5;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem 0 3rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-family: 'EB Garamond', serif;
    }

    footer a { color: var(--saffron); text-decoration: none; opacity: 0.65; }
    footer a:hover { opacity: 1; }

    /* ── Loading ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      gap: 1.2rem;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.1rem;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--border);
      border-top-color: var(--saffron);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      margin: 5rem 0;
      text-align: center;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
    }

    /* ── Fade-in ── */
    .fade-in {
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.7s ease forwards;
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    .fade-in:nth-child(1) { animation-delay: 0.05s; }
    .fade-in:nth-child(2) { animation-delay: 0.18s; }
    .fade-in:nth-child(3) { animation-delay: 0.3s; }
    .fade-in:nth-child(4) { animation-delay: 0.42s; }

    @media (max-width: 600px) {
      main { padding: 0 1.2rem; }
      header { padding-top: 2.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="ik-onkar">ੴ</div>
      <p class="h1-sub">Daily Hukamnama, Sri Harmandir Sahib, Amritsar</p>
      <p class="h1-punjabi">ਰੋਜ਼ਾਨਾ ਹੁਕਮਨਾਮਾ, ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ</p>
      <div class="date-line" id="date-line"></div>
    </header>

    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span>Loading…</span>
      </div>
    </div>

  </main>

  <script>
    const API = 'https://api.gurbaninow.com/v2/hukamnama/today';

    function getTranslation(line) { return line?.translation?.english?.default || ''; }
    function getGurmukhi(line)    { return line?.gurmukhi?.unicode || ''; }
    function getTranslit(line)    { return line?.transliteration?.english?.text || ''; }

    function isRahao(line) {
      return getGurmukhi(line).includes('ਰਹਾਉ') || getTranslit(line).toLowerCase().includes('rahao');
    }

    function isHeader(line) { return line?.type === 2; }

    function cleanEnglish(str) {
      return str
        .replace(/\|\|\d+\|\|Pause\|\|/gi, '')
        .replace(/\|\|Pause\|\|/gi, '')
        .replace(/Pause\|\|/gi, '')
        .replace(/\|\|\d+\|\|/g, '')
        .replace(/\|\|/g, '')
        .replace(/\s+\d+\s*$/, '')
        .replace(/\s{2,}/g, ' ').trim();
    }

    function cleanTranslit(str) {
      return str
        .replace(/\|\s*\d+\s*\|/g, '')
        .replace(/\|/g, '')
        .replace(/\s+\d+\s*$/, '')
        .replace(/\s{2,}/g, ' ').trim();
    }

    function renderDate(dateObj) {
      const g = dateObj?.gregorian || {};
      const np = dateObj?.nanakshahi?.punjabi || {};
      const ne = dateObj?.nanakshahi?.english || {};

      const gregorian = (g.month && g.date)
        ? `${g.month} ${g.date}, ${g.year}` : '';
      const nanakshahi = (np.month && np.date)
        ? `${np.date} ${np.month} ${np.year}` : '';

      const el = document.getElementById('date-line');
      if (!el) return;
      if (gregorian && nanakshahi) {
        el.innerHTML = `<span class="date-gregorian">${gregorian}</span><span class="date-sep">·</span><span class="date-nanakshahi">${nanakshahi}</span>`;
      } else if (gregorian) {
        el.innerHTML = `<span class="date-gregorian">${gregorian}</span>`;
      }
    }

    function renderError(msg) {
      document.getElementById('app').innerHTML = `<div class="error">${msg}</div>`;
    }

    function renderHukamnama(data, synthesis, stale) {
      const rawLines = data.hukamnama || [];
      if (!rawLines.length) { renderError('No lines found.'); return; }

      const lines = rawLines.map(item => item.line || item);

      renderDate(data.date);

      let html = '';

      // Stale notice
      if (stale) {
        html += `<p style="text-align:center;font-size:1rem;color:var(--navy);opacity:0.6;letter-spacing:0.01em;margin-bottom:1.5rem;font-family:'EB Garamond',serif">Today's Hukamnama is on its way — showing yesterday's in the meantime.</p>`;
      }

      // Essence
      if (synthesis) {
        html += `
          <div class="essence fade-in">
            <div class="essence-label">Essence</div>
            <p class="essence-text">${escHtml(synthesis)}</p>
          </div>`;
      }

      html += `<div style="margin:1.5rem 0;height:1px;background:var(--border);opacity:0.5"></div>`;

      // Verses
      html += `<div class="verses fade-in">`;
      for (const line of lines) {
        const gurmukhi = getGurmukhi(line);
        const translit  = getTranslit(line);
        const english   = cleanEnglish(getTranslation(line));
        if (!gurmukhi && !english) continue;

        const header = isHeader(line);
        if (header) continue;

        const rahao = isRahao(line);

        html += `
          <div class="verse${rahao ? ' is-rahao' : ''}">
            <div class="gurmukhi-text">${escHtml(gurmukhi)}</div>
            ${translit ? `<div class="transliteration">${escHtml(cleanTranslit(translit))}</div>` : ''}
            ${english ? `<div class="english-text">${escHtml(english)}</div>` : ''}
          </div>`;
      }
      html += `</div>`;

      document.getElementById('app').innerHTML = html;
    }

    function escHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function fetchWithRetry(url, attempts = 3) {
      for (let i = 0; i < attempts; i++) {
        try {
          const res = await fetch(url);
          if (res.ok) return res;
        } catch (_) {}
        if (i < attempts - 1) await new Promise(r => setTimeout(r, 1000 * (i + 1)));
      }
      return null;
    }

    async function init() {
      try {
        const synthRes = await fetchWithRetry('/api/synthesis');
        if (synthRes) {
          const { synthesis, hukamnama, stale } = await synthRes.json();
          renderHukamnama(hukamnama, synthesis, stale);
          return;
        }
        // All retries failed — fetch hukamnama directly, no synthesis
        const res = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        renderHukamnama(data, null);
      } catch (err) {
        renderError(err.message || 'Network error');
      }
    }

    init();
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
